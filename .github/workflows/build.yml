name: Compilar Collab Free

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    paths:
      - "mod/**"
      - ".github/workflows/build.yml"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
            target: Win64
          - name: Android32
            os: ubuntu-latest
            target: Android32
          - name: Android64
            os: ubuntu-latest
            target: Android64
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Compilar el mod
        uses: geode-sdk/build-geode-mod@main
        with:
          path: mod
          sdk: given
          combine: true
          target: ${{ matrix.config.target }}

  package:
    name: Juntar Windows + Android
    runs-on: ubuntu-latest
    needs: ["build"]
    steps:
      - name: Combinar
        uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - name: Subir el .geode
        uses: actions/upload-artifact@v4
        with:
          name: collab-free-mod
          path: ${{ steps.build.outputs.build-output }}
