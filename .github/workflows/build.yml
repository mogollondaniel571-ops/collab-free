name: Compilar mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    name: ${{ matrix.mod.name }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        mod:
          - name: Collab Free
            path: mod
            artifact: collab-free-mod
          - name: Importador de Mods
            path: importer
            artifact: importador-mods
    steps:
      - uses: actions/checkout@v4

      - name: Compilar el mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          path: ${{ matrix.mod.path }}
          sdk: given
          target: Win64

      - name: Subir el .geode
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.mod.artifact }}
          path: ${{ steps.build.outputs.build-output }}
