name: Compilar Collab Free

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    paths:
      - "mod/**"
      - "installer/**"
      - ".github/workflows/build.yml"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
            target: Win64
          - name: Android32
            os: ubuntu-latest
            target: Android32
          - name: Android64
            os: ubuntu-latest
            target: Android64
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Compilar el mod
        uses: geode-sdk/build-geode-mod@main
        with:
          path: mod
          sdk: given
          combine: true
          target: ${{ matrix.config.target }}

  package:
    name: Juntar Windows + Android
    runs-on: ubuntu-latest
    needs: ["build"]
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Combinar
        uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - name: Subir el .geode
        uses: actions/upload-artifact@v4
        with:
          name: collab-free-mod
          path: ${{ steps.build.outputs.build-output }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Armar el instalador para PC
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p installer/files
          find "${{ steps.build.outputs.build-output }}" -name '*.geode' -exec cp {} installer/files/ \;
          RUN=$(gh run list -R ${{ github.repository }} --workflow importer.yml --status success -L 1 --json databaseId -q '.[0].databaseId')
          gh run download "$RUN" -R ${{ github.repository }} -n importador-mods -D /tmp/importador
          find /tmp/importador -name '*.geode' -exec cp {} installer/files/ \;
          ls -la installer/files
          VERSION=$(jq -r .version mod/mod.json | sed 's/^v//')
          cd installer
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o ../Instalador-Collab-Free.exe .

      - name: Subir el instalador
        uses: actions/upload-artifact@v4
        with:
          name: Instalador-Collab-Free
          path: Instalador-Collab-Free.exe
